name: Backend Test and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'ThomasPool-api/**'
      - 'ThomasPool-api.Tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Run Tests
        run: dotnet test ThomasPool-api.Tests/ThomasPool-api.Tests.csproj

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}